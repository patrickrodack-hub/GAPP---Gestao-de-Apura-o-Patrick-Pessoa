    <script>
      // Gracefully handle and mock Vite dev-server WebSocket closure in AI Studio sandbox
      (function() {
        try {
          var RealWebSocket = window.WebSocket;
          if (RealWebSocket) {
            window.WebSocket = function(url, protocols) {
              var isViteHmr = 
                (typeof protocols === 'string' && protocols.indexOf('vite-hmr') !== -1) ||
                (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
                (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('/@vite/') !== -1));

              if (isViteHmr) {
                var mock = {
                  readyState: 1, // OPEN
                  url: String(url),
                  protocol: 'vite-hmr',
                  extensions: '',
                  binaryType: 'blob',
                  bufferedAmount: 0,
                  send: function() {},
                  close: function() {},
                  addEventListener: function(type, listener) {
                    if (type === 'open') {
                      setTimeout(function() {
                        try { listener({ type: 'open', target: mock }); } catch(e) {}
                      }, 0);
                    }
                  },
                  removeEventListener: function() {},
                  dispatchEvent: function() { return true; },
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null
                };
                setTimeout(function() {
                  if (typeof mock.onopen === 'function') {
                    try { mock.onopen({ type: 'open', target: mock }); } catch(e) {}
                  }
                }, 0);
                return mock;
              }
              return new RealWebSocket(url, protocols);
            };
            window.WebSocket.prototype = RealWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }

          var origError = console.error;
          console.error = function() {
            var args = Array.prototype.slice.call(arguments);
            var text = args.map(function(a) {
              if (a instanceof Error) return a.stack || a.message;
              return typeof a === 'object' ? JSON.stringify(a) : String(a);
            }).join(' ');

            if (
              text.indexOf('WebSocket closed without opened') !== -1 ||
              (text.indexOf('[vite]') !== -1 && text.indexOf('WebSocket') !== -1) ||
              text.indexOf('WebSocket is closed') !== -1
            ) {
              return;
            }
            origError.apply(console, args);
          };

          window.addEventListener('error', function(event) {
            if (
              event &&
              (event.message?.indexOf('WebSocket') !== -1 ||
               event.filename?.indexOf('@vite/client') !== -1 ||
               event.error?.message?.indexOf('WebSocket') !== -1)
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            if (
              event &&
              (event.reason?.message?.indexOf('WebSocket') !== -1 ||
               String(event.reason).indexOf('WebSocket') !== -1)
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          });
        } catch(e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Inicialização instantânea do tema salvo e configurações do usuário antes da renderização -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('apuracao_boi_theme');
          var theme = (saved === 'solidcon' || saved === 'light' || saved === 'dark' || saved === 'gapp-new') ? saved : 'gapp-new';
          document.documentElement.classList.remove('dark', 'light', 'solidcon', 'gapp-new');
          document.documentElement.classList.add(theme);
          if (theme === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', theme);

          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            if (theme === 'gapp-new') meta.setAttribute('content', '#113829');
            else if (theme === 'dark') meta.setAttribute('content', '#07080c');
            else if (theme === 'solidcon') meta.setAttribute('content', '#1b3252');
            else meta.setAttribute('content', '#ffffff');
          }
        } catch(e) {}
      })();
    </script>
